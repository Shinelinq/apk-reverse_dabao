name: Safe Sync Upstream from Codeberg

on:
  schedule:
    # 北京时间每天 08:00（UTC 00:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 防止多个同步任务同时修改 main
concurrency:
  group: safe-sync-codeberg
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Safe sync
        shell: bash
        run: |
          set -euo pipefail

          # 仅允许在 main 分支运行
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Only main is allowed"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          UPSTREAM_URL="https://codeberg.org/dabao1955/apk-reverse.git"
          STATE=".sync-state/codeberg-main.sha"

          # 1. 获取上游 main 的完整历史
          git remote add upstream "$UPSTREAM_URL"

          if ! git fetch --no-tags upstream \
              "+refs/heads/main:refs/remotes/upstream/main"; then
            echo "::error::Upstream unavailable or main missing"
            exit 1
          fi

          NEW=$(git rev-parse refs/remotes/upstream/main)
          OLD=$(git rev-parse HEAD)

          echo "GitHub HEAD: $OLD"
          echo "Codeberg main: $NEW"

          # 2. 检查上一次同步的提交是否仍在上游历史中
          if [[ -f "$STATE" ]]; then
            LAST=$(cat "$STATE")

            if ! [[ "$LAST" =~ ^[0-9a-f]{40}$ ]] ||
               ! git cat-file -e "${LAST}^{commit}" 2>/dev/null ||
               ! git merge-base --is-ancestor "$LAST" "$NEW"; then
              echo "::error::Upstream history rewritten or checkpoint invalid"
              exit 1
            fi
          fi

          # 3. 如果当前 GitHub 已包含上游最新提交，则无需合并
          if git merge-base --is-ancestor "$NEW" "$OLD"; then
            echo "Already contains upstream"

            # 第一次运行时建立同步基准
            if [[ ! -f "$STATE" ]]; then
              mkdir -p .sync-state
              printf '%s\n' "$NEW" > "$STATE"
              git add "$STATE"
              git commit -m "chore: initialize upstream checkpoint"
              git push origin HEAD:main
            fi

            exit 0
          fi

          # 仅合并具有共同历史的仓库，拒绝覆盖独立仓库
          BASE=$(git merge-base "$OLD" "$NEW") || {
            echo "::error::Unrelated Git histories"
            exit 1
          }

          # 4. 验证上游关键文件存在且不是异常空文件
          for FILE in skills/apk-reverse/SKILL.md README.md; do
            TYPE=$(git cat-file -t "$NEW:$FILE" 2>/dev/null || true)

            if [[ "$TYPE" != "blob" ]]; then
              echo "::error::Missing critical file: $FILE"
              exit 1
            fi

            SIZE=$(git cat-file -s "$NEW:$FILE")
            if (( SIZE < 16 )); then
              echo "::error::Critical file too small: $FILE"
              exit 1
            fi
          done

          # 5. 检查仓库文件总量和异常删除比例
          BEFORE=$(git ls-tree -r --name-only "$OLD" | wc -l)
          AFTER=$(git ls-tree -r --name-only "$NEW" | wc -l)
          DELETED=$(git diff --no-renames --diff-filter=D \
              --name-only "$BASE" "$NEW" | wc -l)

          echo "Previous files: $BEFORE"
          echo "Upstream files: $AFTER"
          echo "Deleted paths: $DELETED"

          if (( AFTER < 30 ||
                AFTER * 100 < BEFORE * 70 ||
                DELETED * 100 > BEFORE * 20 )); then
            echo "::error::Suspicious file deletion detected"
            exit 1
          fi

          # 6. 禁止上游变更 GitHub 的自动化和同步状态文件
          CONTROL_CHANGES=$(git diff --name-only "$BASE" "$NEW" -- \
              .github/workflows/ \
              .github/actions/ \
              .sync-state/)

          if [[ -n "$CONTROL_CHANGES" ]]; then
            echo "::error::Protected automation files changed upstream"
            echo "$CONTROL_CHANGES"
            exit 1
          fi

          # 7. 尝试合并，但不自动提交
          if ! git merge --no-ff --no-commit "$NEW"; then
            git merge --abort || true
            echo "::error::Merge conflict, manual review required"
            exit 1
          fi

          # 8. 合并后的最终安全检查
          MERGED_COUNT=$(git ls-files | wc -l)

          if [[ ! -f skills/apk-reverse/SKILL.md ||
                ! -f README.md ||
                ! -f .github/workflows/sync.yml ]] ||
                (( MERGED_COUNT < 30 )); then
            git merge --abort || true
            echo "::error::Post-merge safety check failed"
            exit 1
          fi

          # 9. 保存本次成功同步的上游 SHA
          mkdir -p .sync-state
          printf '%s\n' "$NEW" > "$STATE"
          git add "$STATE"

          git commit -m "chore(sync): merge Codeberg main"

          # 10. 所有检查通过后才推送到 GitHub main
          git push origin HEAD:main

          echo "✅ Safe sync completed"
          {
            echo "### ✅ Safe sync completed"
            echo "Synced upstream: \`$NEW\`"
          } >> "$GITHUB_STEP_SUMMARY"
